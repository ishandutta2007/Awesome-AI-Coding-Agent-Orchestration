<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Pill Gradient -->
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      font-weight: 600;
      fill: #38bdf8;
    }
    .grid-line {
      stroke: #1e293b;
      stroke-width: 1;
      opacity: 0.4;
    }
    .circuit-node {
      fill: #38bdf8;
      opacity: 0.7;
    }

    /* CSS Keyframe animations for dynamic motion */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, -20px); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-25px, 25px); }
    }
    @keyframes signalFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }

    .orb-1 {
      animation: floatOrb1 9s ease-in-out infinite, pulseGlow 6s ease-in-out infinite;
      transform-origin: 950px 100px;
    }
    .orb-2 {
      animation: floatOrb2 11s ease-in-out infinite, pulseGlow 8s ease-in-out infinite;
      transform-origin: 150px 280px;
    }
    .flowing-line {
      stroke-dasharray: 12, 12;
      animation: signalFlow 4s linear infinite;
    }
  </style>

  <!-- Deep background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Animated ambient background glow spheres -->
  <circle class="orb-1" cx="980" cy="110" r="140" fill="#6366f1" filter="url(#glow)" opacity="0.3" />
  <circle class="orb-2" cx="160" cy="270" r="120" fill="#0284c7" filter="url(#glow)" opacity="0.25" />
  <circle cx="600" cy="180" r="180" fill="#a855f7" filter="url(#glow)" opacity="0.1" />

  <!-- Subtle background grid lines -->
  <line x1="0" y1="90" x2="1200" y2="90" class="grid-line" />
  <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
  <line x1="0" y1="270" x2="1200" y2="270" class="grid-line" />
  <line x1="240" y1="0" x2="240" y2="360" class="grid-line" />
  <line x1="480" y1="0" x2="480" y2="360" class="grid-line" />
  <line x1="720" y1="0" x2="720" y2="360" class="grid-line" />
  <line x1="960" y1="0" x2="960" y2="360" class="grid-line" />

  <!-- Dynamic workflow network lines in background (Agent Orchestration Mesh) -->
  <g opacity="0.55">
    <path d="M 850 60 L 960 120 L 1080 80 L 1140 180 L 1020 250 L 890 220 Z" fill="none" stroke="#334155" stroke-width="2" />
    <path d="M 850 60 L 960 120 L 1080 80 L 1140 180" fill="none" stroke="#38bdf8" stroke-width="2" class="flowing-line" />
    <circle cx="850" cy="60" r="6" class="circuit-node" />
    <circle cx="960" cy="120" r="7" class="circuit-node" fill="#818cf8" />
    <circle cx="1080" cy="80" r="6" class="circuit-node" fill="#c084fc" />
    <circle cx="1140" cy="180" r="8" class="circuit-node" fill="#38bdf8" />
    <circle cx="1020" cy="250" r="6" class="circuit-node" fill="#818cf8" />
    <circle cx="890" cy="220" r="5" class="circuit-node" />

    <path d="M 60 140 L 140 80 L 220 150 L 180 260 L 80 240 Z" fill="none" stroke="#334155" stroke-width="2" />
    <path d="M 60 140 L 140 80 L 220 150 L 180 260" fill="none" stroke="#818cf8" stroke-width="2" class="flowing-line" />
    <circle cx="60" cy="140" r="5" class="circuit-node" />
    <circle cx="140" cy="80" r="7" class="circuit-node" fill="#38bdf8" />
    <circle cx="220" cy="150" r="6" class="circuit-node" fill="#c084fc" />
    <circle cx="180" cy="260" r="6" class="circuit-node" fill="#818cf8" />
    <circle cx="80" cy="240" r="5" class="circuit-node" />
  </g>

  <!-- Foreground Content Area: Clear & Crisp Contrast -->
  <g transform="translate(100, 75)">
    <!-- Category Pill Badge -->
    <rect x="0" y="0" width="310" height="34" rx="17" fill="url(#pill-grad)" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="18" cy="17" r="4" fill="#38bdf8" />
    <text x="32" y="22" class="badge-text">⚡ AI CODING AGENT FLEETS &amp; CI/CD</text>

    <!-- Main Title -->
    <text x="0" y="85" class="title">
      Awesome AI Coding Agent
    </text>
    <text x="0" y="135" class="title" fill="url(#primary-grad)">
      Orchestration Platforms
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="178" class="subtitle">
      Curated Ecosystem of Enterprise SaaS Platforms &amp; Open-Source Fleets
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 205)">
      <rect x="0" y="0" width="135" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="18" font-family="system-ui" font-size="12" fill="#cbd5e1" font-weight="500">🤖 Multi-Agent</text>

      <rect x="145" y="0" width="155" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="157" y="18" font-family="system-ui" font-size="12" fill="#cbd5e1" font-weight="500">🔄 Lifecycle Hooks</text>

      <rect x="310" y="0" width="170" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="322" y="18" font-family="system-ui" font-size="12" fill="#cbd5e1" font-weight="500">🛡️ Sandboxed Worktrees</text>

      <rect x="490" y="0" width="155" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="502" y="18" font-family="system-ui" font-size="12" fill="#cbd5e1" font-weight="500">🚀 CI/CD Delivery</text>
    </g>
  </g>

  <!-- Clean Border Outline -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#334155" stroke-width="1.5" />
</svg>
