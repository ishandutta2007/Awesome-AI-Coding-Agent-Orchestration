<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1b2a"/><stop offset="100%" stop-color="#1b263b"/></linearGradient><linearGradient id="primary-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="pill-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".15"/><stop offset="100%" stop-color="#818cf8" stop-opacity=".05"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.25;transform:scale(1)}50%{opacity:.65;transform:scale(1.08)}}@keyframes floatOrb1{0%{transform:translate(0,0)}50%{transform:translate(30px,-20px)}}@keyframes floatOrb2{0%{transform:translate(0,0)}50%{transform:translate(-25px,25px)}}@keyframes signalFlow{0%{stroke-dashoffset:200}}.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:44px;fill:#fff;letter-spacing:-.5px}.subtitle{font-weight:400;font-size:20px;fill:#94a3b8}.badge-text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:13px;font-weight:600;fill:#38bdf8}.grid-line{stroke:#1e293b;stroke-width:1;opacity:.4}.circuit-node{fill:#38bdf8;opacity:.7}.orb-1{animation:floatOrb1 9s ease-in-out infinite,pulseGlow 6s ease-in-out infinite;transform-origin:950px 100px}.orb-2{animation:floatOrb2 11s ease-in-out infinite,pulseGlow 8s ease-in-out infinite;transform-origin:150px 280px}.flowing-line{stroke-dasharray:12,12;animation:signalFlow 4s linear infinite}</style><rect width="120